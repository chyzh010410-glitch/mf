name: MF Platform CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # ========== 后端 ==========
      - name: Build Java services
        run: |
          cd mf-platform
          mvn clean package -DskipTests -q

      # ========== 前端 ==========
      - name: Build Admin Frontend
        run: |
          cd mf-frontend
          npm install && npm run build

      - name: Build Client Frontend
        run: |
          cd mf-frontend-client
          npm install && npm run build

